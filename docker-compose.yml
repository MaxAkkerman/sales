# Корень репозитория — Timeweb Apps: docker-compose build / docker-compose up -d
# Локально: docker compose up -d --build  или  cd app && docker compose up -d --build

version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
      POSTGRES_DB: sales
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    image: mgroup-sales:latest
    build: ./app
    ports:
      - "80:8080"
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://sales:sales@db:5432/sales
      AUTH_USER: maxAkerman
      AUTH_PASSWORD: maxAkerman
      JWT_SECRET: change-me-on-server
      PORT: "8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
