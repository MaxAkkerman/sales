# Timeweb: docker-compose build && docker-compose up -d
# Один внешний порт 80 — без конфликта с 8080 на хосте платформы.
# Имя образа не задаём: иначе up пытается pull mgroup-sales:latest с Docker Hub.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
      POSTGRES_DB: sales
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    environment:
      DATABASE_URL: postgres://sales:sales@db:5432/sales
      AUTH_USER: maxAkerman
      AUTH_PASSWORD: maxAkerman
      JWT_SECRET: change-me-on-server
      PORT: "8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
