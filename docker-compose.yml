# Timeweb App Platform:
# — первый сервис получает технический домен
# — хост-порты 80 и 443 запрещены
# — директива volumes запрещена
# — платформа сама читает этот файл (не обязательно звать docker-compose build вручную)

version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://sales:sales@db:5432/sales
      AUTH_USER: maxAkerman
      AUTH_PASSWORD: maxAkerman
      JWT_SECRET: change-me-on-server
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
      POSTGRES_DB: sales
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
